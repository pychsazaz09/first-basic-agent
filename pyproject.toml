[project]
name = "simple-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.15.0",
    "chromadb>=1.5.9",
    "docling>=2.125.0",
    "docling-core[chunking-openai]>=2.94.1",
    "flagembedding>=1.4.2",
    "jieba>=0.42.1",
    "mcp>=2.1.1",
    "openai>=3.8.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["exp-llm-mcp-rag/src/test"]
pythonpath = ["exp-llm-mcp-rag/src"]
